[project]
name = "quorex"
version = "0.1.0"
description = "Mémoire de faits bitemporelle pour agents IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "uuid-utils>=0.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3.0"]
gemini = ["google-genai>=0.3"]

[project.scripts]
quorex = "quorex.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gemini: scénarios rejoués contre le vrai LLM (nécessite QUOREX_GEMINI_API_KEY)",
    "acceptance: scénarios de tests/acceptance/SCENARIOS.md",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]