# Table de synonymes d'attributs (ADR-004)
#
# Clé : forme canonique, déjà normalisée (minuscule, sans accents, snake_case)
# Valeurs : variantes telles qu'elles sortent de normalize() AVANT le lookup.
# La forme canonique elle-même n'a pas besoin d'être listée comme variante.
# 
# Règles : 
# - Une variante appartient à un seul canonique. Le chargeur refuse les doublons.
# - Français et anglais mélangés : le produit reçoit les deux.
# - On n'ajoute une variante que si on l'a vue ou qu'on est sûr de la voir.
#   Ce fichier est mesuré (taux de résolution au niveau a), pas décoré.
# - Toute ligne ajoutée après un cas réel cite l'attribute_raw d'origine en commentaire.

